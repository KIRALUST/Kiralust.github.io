<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MENU - KIRA LUST</title>
<style>
body {margin:0; background:#000; font-family:'Georgia', serif;}

.menu {
    width:100%; height:100vh;
    background:url('porta-aberta.jpg') center/cover no-repeat;
    display:flex; flex-direction:column; 
    justify-content:center; align-items:center;
}

.titulo {
    color:#DC143C; font-size:48px; 
    text-shadow:0 0 25px #DC143C; 
    margin-bottom:50px;
    animation:brilho 2s infinite;
}

@keyframes brilho {
    0%, 100% {text-shadow:0 0 25px #DC143C;}
    50% {text-shadow:0 0 40px #ff0033;}
}

.botoes a {
    display:block; color:#fff; text-decoration:none; font-size:22px;
    padding:16px 45px; border:2px solid #DC143C; 
    background:rgba(0,0,0,0.7); margin:18px; 
    text-align:center; min-width:260px; 
    transition:0.3s; letter-spacing:2px;
}

.botoes a:hover {
    background:#DC143C; 
    box-shadow:0 0 25px #DC143C;
    transform:scale(1.08);
}
</style>
</head>
<body>
<div class="menu">
    <div class="titulo">KIRA LUST</div>
    <div class="botoes">
        <a href="#">ENTRAR</a>
        <a href="#">GALERIA</a>
        <a href="#">CONTATO VIP</a>
    </div>
</div>
</body>
</html>
