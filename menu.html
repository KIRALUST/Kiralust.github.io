    color: #ff0000; text-decoration: none;
    letter-spacing: 4px; text-transform: uppercase;
    background: rgba(255,0,0,0.08);
  }
  .menu a:hover { background: rgba(255,0,0,0.25); box-shadow: 0 0 15px rgba(255,0,0,0.5); }
</style>

  <div class="topo">
