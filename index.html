<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIRA LUX</title>
<style>
* {margin:0; padding:0; box-sizing:border-box;}
body {background:#000; color:#fff; font-family:'Georgia', serif;}

.header {
    background:#000;
    padding:10px 15px;
    position:sticky;
    top:0;
    z-index:10;
    border-bottom:1px solid #DC143C;
}
.top {
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:8px;
}
.top img {
    width:55px;
    height:55px;
    border:2px solid #DC143C;
    object-fit:cover;
}
.top h1 {
    color:#DC143C;
    font-size:36px;
    text-shadow:0 0 15px #DC143C, 0 0 30px #DC143C;
    letter-spacing:4px;
    animation:brilhar 2s infinite;
}
@keyframes brilhar {
    0%,100% {opacity:1;}
    50% {opacity:0.8;}
}
.menu {
    display:flex;
    gap:8px;
}
.menu a {
    flex:1;
    text-align:center;
    color:#DC143C;
    text-decoration:none;
    border:1px solid #DC143C;
    padding:6px 0;
    font-size:13px;
    letter-spacing:1px;
    transition:0.3s;
}
.menu a:hover {background:#DC143C; color:#000; box-shadow:0 0 10px #DC143C;}

.banner {
    width:100%;
    height:calc(100vh - 125px);
    background:url('Messenger_creation_1107486295409870.jpeg') center/cover no-repeat;
}
</style>
</head>
<body>

<div class="header">
    <div class="top">
        <img src="image_d73fa71d.jpg" alt="Kira">
        <h1>KIRA LUX</h1>
    </div>
    <div class="menu">
        <a href="sobre.html">Sobre</a>
        <a href="galeria.html">Galeria</a>
        <a href="contato.html">Contato</a>
    </div>
</div>

<div class="banner"></div>

</body>
</html>
