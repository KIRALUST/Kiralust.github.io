<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIRA LUX</title>
<style>
* {margin:0; padding:0; box-sizing:border-box;}
body {
    background:#000; 
    display:flex; 
    flex-direction:column;
    justify-content:center; 
    align-items:center; 
    height:100vh;
    font-family:'Georgia', serif;
    overflow:hidden;
}

.logo {
    color:#DC143C; 
    font-size:72px; 
    font-weight:bold;
    text-shadow:0 0 30px #DC143C, 0 0 60px #DC143C; 
    animation:piscar 2s infinite;
    letter-spacing:5px;
    margin-bottom:60px;
}

@keyframes piscar {
    0%, 100% {opacity:1; text-shadow:0 0 30px #DC143C;}
    50% {opacity:0.7; text-shadow:0 0 50px #ff0033;}
}

.btn-entrar {
    color:#fff; 
    font-size:24px; 
    text-decoration:none; 
    border:2px solid #DC143C; 
    padding:18px 50px;
    background:rgba(0,0,0,0.7);
    letter-spacing:3px;
    transition:0.3s;
}

.btn-entrar:hover {
    background:#DC143C;
    color:#000;
    font-weight:bold;
    box-shadow:0 0 30px #DC143C;
    transform:scale(1.1);
}
</style>
</head>
<body>
<div class="logo">KIRA LUX</div>
<a href="menu.html" class="btn-entrar">ENTRAR</a>
</body>
</html>
