<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIRA LUST</title>
<style>
body {
    margin:0;
    background:#000;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.porta {
    width:500px;
    height:700px;
    background:url('https://i.imgur.com/8bK2gZQ.png') center/cover no-repeat;
    cursor:pointer;
    animation: respirar 4s infinite ease-in-out;
    filter:drop-shadow(0 0 20px #DC143C);
    transition:0.3s;
}

.porta:hover {
    filter:drop-shadow(0 0 40px #DC143C);
    transform:scale(1.02);
}

@keyframes respirar {
    0%, 100% {transform:scale(1);}
    50% {transform:scale(1.03);}
}

@media(max-width:600px){
    .porta {width:90vw; height:126vw;}
}
</style>
</head>
<body>

<a href="menu.html">
    <div class="porta"></div>
</a>

</body>
</html>
