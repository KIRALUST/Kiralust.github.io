<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIRA LUX | Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
<style>
  body, html { margin:0; padding:0; background:#000; height:100%; width:100%; overflow:hidden; }
  .container {
    position:relative;
    width:100vw; height:100vh;
    background:#000;
    display:flex; justify-content:center; align-items:center;
  }
  .portal-full {
    width:100%; height:100vh;
    object-fit:contain; background:#000;
    transition:0.5s;
  }
  /* FOTO 3X4 */
  .foto-3x4 {
    position:absolute;
    top:20px; left:20px;
    z-index:30;
    width:85px; height:105px;
    object-fit:cover;
    border:2px solid #DC143C;
    border-radius:4px;
    box-shadow:0 0 15px #DC143C;
  }
  /* NOME KIRA LUX */
  .titulo {
    position:absolute;
    top:28px; left:50%;
    transform:translateX(-50%);
    z-index:20;
    font-family:'Cinzel', serif;
    font-size:5.5vw;
    color:#DC143C;
    letter-spacing:8px;
    margin:0;
    text-shadow:0 0 10px #000, 0 0 20px #DC143C, 0 0 40px #DC143C;
  }
  /* PORTA BRILHANDO - AGORA VAI PRA MENU.HTML */
  .porta-link {
    position:absolute;
    top:32%; left:71%;
    width:18%; height:50%;
    cursor:pointer; z-index:10;
    border-radius:10px; transition:0.4s;
  }
  .porta-link:hover {
    background:rgba(220,20,60,0.15);
    box-shadow:0 0 30px #DC143C, 0 0 60px #DC143C, inset 0 0 30px rgba(220,20,60,0.5);
  }
  .container:has(.porta-link:hover) .portal-full {
    filter:brightness(1.15);
  }
</style>
</head>
<body>

<div class="container">
  <img src="kira-3x4.jpg" class="foto-3x4" alt="Kira">
  <h1 class="titulo">KIRA LUX</h1>
  <img src="kira-portal.jpg" class="portal-full" alt="Kira Lux Portal">
  
  <!-- CORRIGIDO: VAI PRA MENU.HTML -->
  <a href="menu.html" class="porta-link" title="ENTRAR"></a>
</div>

</body>
</html>
