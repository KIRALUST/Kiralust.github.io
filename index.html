<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIRA LUX</title>
<style>
* {margin:0; padding:0; box-sizing:border-box;}
body {background:#000; color:#fff; font-family:'Georgia', serif; overflow-x:hidden;}

.header {background:#000; padding:25px 20px; border-bottom:3px solid #DC143C;}
.top {display:flex; align-items:center; gap:30px; margin-bottom:15px; justify-content:center;}
.top img {width:130px; height:130px; border:4px solid #DC143C; object-fit:cover; box-shadow:0 0 25px #DC143C;}
.top h1 {color:#DC143C; font-size:72px; text-shadow:0 0 25px #DC143C, 0 0 50px #DC143C; letter-spacing:6px; animation:brilhar 2s infinite;}
@keyframes brilhar {0%,100% {opacity:1;} 50% {opacity:0.8;}}
.menu {display:flex; gap:15px; max-width:800px; margin:0 auto;}
.menu a {flex:1; text-align:center; color:#DC143C; text-decoration:none; border:2px solid #DC143C; padding:10px 0; font-size:16px; letter-spacing:2px;}
.menu a:hover {background:#DC143C; color:#000;}

.banner {
    width:100%;
    height:calc(100vh - 180px);
    background:url('https://raw.githubusercontent.com/KIRALUST/kiralust.github.io/main/Messenger_creation_1107486295409870.jpeg') center/cover no-repeat;
    position:relative;
    display:flex; align-items:center; justify-content:center;
}

.btn-entrar {
    position:absolute; top:50%; left:50%; transform:translate(-50%, -50%);
    background:linear-gradient(45deg, #DC143C, #8B0000);
    color:#fff; text-decoration:none; padding:20px 70px;
    font-size:24px; font-weight:bold; letter-spacing:4px;
    border:3px solid #DC143C; border-radius:10px;
    box-shadow:0 0 30px #DC143C; animation:pulso 1.5s infinite;
}
@keyframes pulso {0%,100% {transform:translate(-50%, -50%) scale(1);} 50% {transform:translate(-50%, -50%) scale(1.05);}}
</style>
</head>
<body>

<div class="header">
    <div class="top">
        <img src="image_d73fa71d.jpg" alt="Kira">
        <h1>KIRA LUX</h1>
    </div>
    <div class="menu">
        <a href="sobre.html">Sobre</a>
        <a href="galeria.html">Galeria</a>
        <a href="contato.html">Contato</a>
    </div>
</div>

<div class="banner">
    <a href="menu.html" class="btn-entrar">ENTRAR</a>
</div>

</body>
</html>
