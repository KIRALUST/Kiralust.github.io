<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIRA LUX</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; width: 100vw; height: 100vh; overflow: hidden; }

  /* TOPO ESTICADO DE UM LADO AO OUTRO */
  .topo-header {
    position: fixed; top: 0; left: 0; width: 100vw;
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 0;
    z-index: 9999;
    background: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,0.8) 60%, transparent 100%);
  }
  .foto-3x4 {
    width: 18vw; max-width: 70px;
    height: 24vw; max-height: 90px;
    object-fit: cover;
    border: 2px solid #fff;
    border-radius: 2px;
    margin-left: 3vw;
    flex-shrink: 0;
  }
  .logo-kira {
    width: 78vw;
    color: #ff0000;
    font-family: Impact, 'Arial Black', sans-serif;
    font-size: 11.5vw;
    letter-spacing: 0.18em;
    font-weight: 900;
    text-align: left;
    text-shadow: 0 0 12px rgba(255,0,0,0.8), 0 0 30px rgba(255,0,0,0.4);
    margin-right: 2vw;
    white-space: nowrap;
  }

  .portal-wrapper {
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding-top: 85px;
    background: #000;
  }
  .portal-box {
    position: relative;
    width: 100vw;
    display: flex;
    justify-content: center;
  }
  .portal-img {
    width: 100vw;
    height: auto;
    max-height: 80vh;
    object-fit: contain;
    display: block;
  }
  .texto-toque {
    color: #fff; font-family: monospace;
    font-size: 10px; letter-spacing: 4px;
    margin-top: 15px; opacity: 0.6;
  }

  /* BOTÃO SEMITRANSPARENTE RESPIRANDO */
  .porta-botao {
    position: absolute;
    top: 30%;
    left: 57%;
    width: 35%;
    height: 52%;
    z-index: 10;
    cursor: pointer;
    background: rgba(255, 0, 0, 0.22);
    border: 1px solid rgba(255, 0, 0, 0.7);
    border-radius: 2px;
    animation: respirarBotao 2.2s ease-in-out infinite;
  }

  @keyframes respirarBotao {
    0% {
      background: rgba(255, 0, 0, 0.15);
      box-shadow: 0 0 8px rgba(255, 0, 0, 0.3);
      transform: scale(1);
    }
    50% {
      background: rgba(255, 0, 0, 0.38);
      box-shadow: 0 0 22px rgba(255, 0, 0, 0.8), 0 0 35px rgba(255, 0, 0, 0.4);
      transform: scale(1.02);
    }
    100% {
      background: rgba(255, 0, 0, 0.15);
      box-shadow: 0 0 8px rgba(255, 0, 0, 0.3);
      transform: scale(1);
    }
  }
</style>
</head>
<body>

<header class="topo-header">
  <img src="kira-3x4.jpg" class="foto-3x4" alt="Kira">
  <h1 class="logo-kira">KIRA LUX</h1>
</header>

<div class="portal-wrapper">
  <div class="portal-box">
    <img src="kira-portal.jpg" class="portal-img" alt="Portal">
    <a href="menu.html" class="porta-botao" title="Toque na porta"></a>
  </div>
  <p class="texto-toque">TOQUE NA PORTA</p>
</div>

</body>
</html>
