<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIRA LUX</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; width: 100vw; height: 100vh; overflow: hidden; }

  .topo-header {
    position: fixed; top: 0; left: 0; width: 100%;
    display: flex; align-items: center; gap: 15px;
    padding: 15px 20px; z-index: 9999;
    background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
  }
  .foto-3x4 { width: 55px; height: 75px; object-fit: cover; border: 2px solid #fff; border-radius: 3px; }
  .logo-kira {
    flex: 1; color: #ff0000;
    font-family: Impact, 'Arial Black', sans-serif;
    font-size: 9vw; letter-spacing: 0.2em; font-weight: 900;
    text-shadow: 0 0 12px rgba(255,0,0,0.8);
  }

  .portal-wrapper {
    position: relative; width: 100%; height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding-top: 80px;
  }
  .portal-img {
    width: 90%; max-width: 600px; display: block;
    animation: respira 3.5s ease-in-out infinite;
  }
  @keyframes respira {
    0%,100% { transform: scale(1); filter: brightness(1); }
    50% { transform: scale(1.03); filter: brightness(1.15); }
  }
  .texto-toque { color: #fff; font-family: monospace; font-size: 11px; letter-spacing: 5px; margin-top: 25px; opacity: 0.6; }

  /* BOTÃO VERMELHO TRANSPARENTE - TAMANHO DA PORTA TODA */
  .porta-botao {
    position: absolute; top: 50%; left: 50.5%;
    transform: translate(-50%, -50%);
    width: 26%; height: 62%;
    z-index: 999; cursor: pointer;
    background: rgba(255, 0, 0, 0.25);
    border: 1px solid rgba(255, 0, 0, 0.5);
    box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
    border-radius: 2px;
  }
  .porta-botao:hover {
    background: rgba(255, 0, 0, 0.4);
  }
</style>
</head>
<body>

<header class="topo-header">
  <img src="kira-3x4.jpg" class="foto-3x4">
  <h1 class="logo-kira">KIRA LUX</h1>
</header>

<div class="portal-wrapper">
    <img src="kira-portal.jpg" class="portal-img">
    <p class="texto-toque">TOQUE NA PORTA</p>
    <a href="menu.html" class="porta-botao"></a>
</div>

</body>
</html>
