<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIRA LUX | Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
<style>
body, html { margin:0; padding:0; background:#000; height:100%; overflow:hidden; }
.homepage-container { position:relative; width:100%; height:100vh; }

/* PORTAL */
.portal-wrapper { position:relative; width:100%; height:100vh; display:flex; align-items:center; justify-content:center; background:#000; }
.portal-img { width: 100%; height: 100vh; object-fit: contain; }

/* TOPO - MOVIDO PRA DIREITA */
.topo { 
    position:absolute; 
    top:15px; 
    left:25px;   /* AUMENTEI de 15px pra 25px */
    right:15px; 
    z-index:999; 
    display:flex; 
    flex-direction:column; 
    gap:12px; 
}
.linha-topo { 
    display:flex; 
    align-items:center; 
    justify-content:flex-end; /* JOGA TUDO PRA DIREITA */
    gap:15px; 
    width:100%; 
}
.foto { height:14vh; max-height:120px; border:3px solid #DC143C; border-radius:3px; flex-shrink:0; }
.nome { font-family:'Cinzel', serif; font-size:9vw; font-weight:700; color:#DC143C; margin:0; text-shadow:0 0 12px #DC143C, 2px 2px 5px #000; letter-spacing:3px; white-space:nowrap; }

/* 3 BOTOES DO TOPO */
.botoes { display:flex; gap:10px; justify-content:flex-end; /* BOTOES TAMBEM PRA DIREITA */ }
.botoes a { flex:1; max-width:120px; text-align:center; padding:8px 5px; background:rgba(0,0,0,0.85); color:#DC143C; text-decoration:none; border:1px solid #DC143C; font-family:Arial; font-size:14px; font-weight:bold; }
.botoes a:hover { background:#DC143C; color:#000; }

/* BOTÃO DA PORTA */
.porta-botao { 
    position:absolute; 
    top:48%;      
    left:70.5%;   
    transform:translate(-50%, -50%); 
    width:22%;    
    height:42%;   
    z-index:998; 
    cursor:pointer; 
    border-radius:8px;
    animation: pulsar 2s infinite;
    transition: all 0.3s ease;
}
.porta-botao:hover {
    box-shadow: 0 0 40px 15px rgba(220, 20, 60, 0.8);
    background: rgba(220, 20, 60, 0.1);
}
@keyframes pulsar {
    0% { box-shadow: 0 0 0 0 rgba(220, 20, 60, 0.4); }
    70% { box-shadow: 0 0 0 20px rgba(220, 20, 60, 0); }
    100% { box-shadow: 0 0 0 0 rgba(220, 20, 60, 0); }
}
</style>
</head>
<body>

<div class="homepage-container">
    <div class="topo">
        <div class="linha-topo">
            <img src="image_d73fa71d.jpg" class="foto">
            <h1 class="nome">KIRA LUX</h1>
        </div>
        <div class="botoes">
            <a href="sobre.html">Sobre</a>
            <a href="galeria.html">Galeria</a>
            <a href="contato.html">Contato</a>
        </div>
    </div>

    <div class="portal-wrapper">
        <img src="Messenger_creation_1107486295409870.jpeg" class="portal-img">
        <a href="galeria.html" class="porta-botao" onclick="tocarSom()"></a>
    </div>

    <audio id="somPorta" src="https://www.soundjay.com/mechanical/sounds/door-open-1.mp3" preload="auto"></audio>
</div>

<script>
function tocarSom() {
    document.getElementById('somPorta').play();
}
</script>

</body>
</html>
