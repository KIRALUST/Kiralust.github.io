<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arte Gótica - Portal</title>
    <style>
        /* Configurações de centralização da página */
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Contêiner responsivo que prende o botão sobre a imagem */
        .homepage-container {
            position: relative;
            max-width: 900px; /* Alinhe com a largura máxima do seu layout */
            width: 100%;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
        }

        .homepage-container img {
            width: 100%;
            display: block;
            height: auto;
        }

        /* BOTÃO INTERATIVO INVISÍVEL - COBERTURA TOTAL DA PORTA */
        .porta-botao {
            position: absolute;
            
            /* Caixa delimitadora externa (Bounding Box) */
            top: 20%;             /* Topo máximo do arco */
            left: 59%;            /* Extremo esquerdo da porta */
            width: 22.5%;         /* Largura total da porta */
            height: 65.5%;        /* Altura total até o chão */
            
            cursor: pointer;
            background-color: rgba(255, 255, 255, 0); /* Totalmente transparente */
            
            /* RECORTAR NO FORMATO EXATO DO ARCO GÓTICO:
               Desenha os pontos subindo pelo lado esquerdo, afinando no bico do arco 
               no topo central, descendo pelo lado direito e fechando a base retangular no chão. */
            clip-path: polygon(
                0% 100%,         /* Base inferior esquerda */
                0% 30%,          /* Início da curvatura esquerda */
                25% 10%,         /* Subida do arco */
                50% 0%,          /* Bico/Pico do arco gótico (centro superior) */
                75% 10%,         /* Descida do arco */
                100% 30%,        /* Início da curvatura direita */
                100% 100%        /* Base inferior direita */
            );

            /* Transição suave para o efeito visual */
            transition: background-color 0.4s ease, filter 0.4s ease;
            
            /* Garante que o clique seja registrado apenas dentro do recorte do clip-path */
            pointer-events: auto; 
        }

        /* EFEITO VISUAL AO PASSAR O MOUSE (:HOVER) */
        .porta-botao:hover {
            /* Dá uma tonalidade de néon avermelhado místico que preenche 100% da madeira da porta */
            background-color: rgba(139, 0, 0, 0.15);
            
            /* Cria um reflexo pulsante de luz nas bordas do recorte gótico */
            filter: drop-shadow(0px 0px 15px rgba(212, 175, 55, 0.6));
        }
    </style>
</head>
<body>

    <div class="homepage-container">
        <!-- Sua imagem final com o texto corrigido em latim -->
        <img src="portal-gotico.png" alt="Portal Gótico - Ingrede ut lucem cognoscas in arte umbrarum">
        
        <!-- Botão perfeitamente moldado sobre a estrutura da porta -->
        <a href="galeria.html" class="porta-botao" title="Ingrede ut lucem cognoscas in arte umbrarum"
           onmouseenter="const som = document.getElementById('som-porta'); som.currentTime = 0; som.play();">
        </a>
    </div>

    <!-- Elemento do efeito sonoro -->
    <audio id="som-porta" preload="auto">
        <source src="som-porta-abrindo.mp3" type="audio/mpeg">
    </audio>

</body>
</html>
