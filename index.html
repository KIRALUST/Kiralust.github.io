<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>KIRA LUX</title>
<style>
body {
    margin:0;
    background:#000;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.porta {
    width:400px;
    animation: respira 2s infinite;
    cursor:pointer;
    transition:0.3s;
}

@keyframes respira {
    0%, 100% { transform:scale(1); filter:drop-shadow(0 0 10px #DC143C); }
    50% { transform:scale(1.03); filter:drop-shadow(0 0 30px #DC143C); }
}

.porta:hover {
    filter:drop-shadow(0 0 40px #DC143C);
}
</style>
</head>
<body>

<a href="menu.html">
  <img src="https://i.imgur.com/8bK2gZQ.png" class="porta" alt="Porta">
</a>

<audio autoplay loop>
  <source src="som_porta.mp3" type="audio/mpeg">
</audio>

</body>
</html>
