<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KIRA LUST</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      height: 100vh;
      background-image: url('IMG_5c552ac3-9e1d-4112-b7f1-74130cb0961a.jpg');
      background-size: cover;
      background-position: center;
      font-family: 'Cinzel', serif;
      color: white;
      position: relative;
    }

    /* Menu */
    .menu {
      position: absolute;
      top: 40px;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 50px;
      font-size: 1.2em;
      letter-spacing: 5px;
    }
    .menu a { color: white; text-decoration: none; text-shadow: 2px 2px 5px black; }
    .menu a:hover { color: #ccc; }

    /* KIRA LUST */
    .titulo {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      font-size: 4.5em;
      letter-spacing: 12px;
      font-weight: 700;
      text-shadow: 0 0 25px black;
    }

    /* Obra #1 - canto direito embaixo pra não pegar a silhueta */
    .obra {
      position: absolute;
      bottom: 100px;
      right: 40px;
      width: 160px;
      border: 2px solid white;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
      opacity: 0.9;
      transition: 0.3s;
    }
    .obra:hover { opacity: 1; transform: scale(1.05); }

    /* Botão */
    .btn-galeria {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 35px;
      border: 2px solid white;
      background: rgba(0,0,0,0.5);
      color: white;
      text-decoration: none;
      font-size: 1.1em;
      letter-spacing: 4px;
      transition: 0.3s;
    }
    .btn-galeria:hover { background: white; color: black; }

    /* Ajuste pro celular */
    @media (max-width: 768px) {
      .titulo { font-size: 3em; letter-spacing: 8px; }
      .menu { gap: 20px; font-size: 0.9em; }
      .obra { width: 120px; bottom: 90px; right: 20px; }
    }
  </style>
</head>
<body>

  <nav class="menu">
    <a href="index.html">HOME</a>
    <a href="galeria.html">GALERIA</a>
    <a href="sobre.html">SOBRE</a>
    <a href="contato.html">CONTATO</a>
  </nav>

  <h1 class="titulo">KIRA<br>LUST</h1>

  <img src="obra1.jpg" alt="Obra #1" class="obra">

  <a href="galeria.html" class="btn-galeria">ENTRAR NA GALERIA</a>

</body>
</html>
