<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIRA LUX | Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
<style>
body, html { margin:0; padding:0; background:#000; height:100%; overflow:hidden; }
.homepage-container { position:relative; width:100%; height:100vh; }

/* PORTAL INTEIRO */
.portal-img {
    width: 100%;
    height: 100vh;
    object-fit: contain;
    background: #000;
}

/* TOPO */
.topo {
    position:absolute; 
    top:20px; 
    left:20px; 
    z-index:999;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.linha-topo {
    display:flex;
    align-items:stretch; /* alinha pela altura */
    gap:15px;
}

/* FOTO E NOME COM MESMA ALTURA */
.foto {
    height:18vh; /* altura da foto */
    max-height:160px;
    width:auto;
    border:2px solid #DC143C;
    border-radius:2px;
}

.nome {
    font-family:'Cinzel', serif; 
    font-size:18vh; /* MESMA ALTURA DA FOTO */
    max-font-size:160px;
    line-height:18vh; /* pra centralizar vertical */
    max-line-height:160px;
    font-weight:700;
    color:#DC143C; /* VERMELHO */
    margin:0; 
    text-shadow:0 0 15px #DC143C, 2px 2px 4px #000;
    letter-spacing:2px;
    display:flex;
    align-items:center;
}

.botoes {
    display:flex; 
    gap:10px;
}
.botoes a {
    padding:8px 16px; 
    background:rgba(0,0,0,0.85); 
    color:#DC143C; 
    text-decoration:none; 
    border:1px solid #DC143C;
    font-family:Arial;
    font-size:14px;
    font-weight:bold;
    transition:0.3s;
}
.botoes a:hover {
    background:#DC143C;
    color:#000;
}

/* BOTÃO INVISÍVEL DA PORTA */
.porta-botao {
    position:absolute; 
    top:45%; 
    left:68%; 
    width:18%; 
    height:35%; 
    z-index:998;
}
</style>
</head>
<body>

<div class="homepage-container">

    <!-- TOPO -->
    <div class="topo">
        <!-- FOTO + NOME MESMA ALTURA -->
        <div class="linha-topo">
            <img src="image_d73fa71d.jpg" class="foto">
            <h1 class="nome">KIRA LUX</h1>
        </div>
        
        <!-- 3 BOTOES EMBAIXO -->
        <div class="botoes">
            <a href="sobre.html">Sobre</a>
            <a href="galeria.html">Galeria</a>
            <a href="contato.html">Contato</a>
        </div>
    </div>

    <!-- PORTAL ATRAS -->
    <img src="Messenger_creation_1107486295409870.jpeg" class="portal-img">

    <!-- BOTAO DA PORTA -->
    <a href="galeria.html" class="porta-botao"></a>

</div>

</body>
</html>
