<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KIRA LUX - Portal</title>

  <style>
    :root {
      /* altura do topo (foto + título) — responsiva */
      --hero-h: clamp(84px, 12vh, 140px);
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; }
    body {
      background:#000;
      color:#fff;
      font-family: Arial, Helvetica, sans-serif;
      min-height:100vh;
      margin:0;
    }

    /* HEADER: foto 3x4 + título com mesma altura e ocupando toda a largura do topo */
    .hero {
      height: var(--hero-h);
      display:flex;
      align-items:center;
      gap:12px;             /* pequeno espaçamento entre foto e título */
      padding:0 12px 0 12px;/* mantém respiração nas laterais */
      width:100vw;          /* ocupa toda a largura da viewport */
      justify-content:flex-start;
      position:relative;
      z-index:3; /* garante que o header fique acima do portal */
      box-sizing:border-box;
      background:transparent;
    }

    .profile-wrap { flex: 0 0 auto; display:flex; align-items:center; height:100%; }
    .profile-photo {
      height:100%;             /* mesma altura do header */
      aspect-ratio:3/4;        /* preserva proporção 3x4 */
      width:auto;
      object-fit:cover;
      border: 3px solid #ff0000;
      box-shadow: 0 0 18px rgba(255,0,0,0.7), 0 0 28px rgba(255,0,0,0.35);
      border-radius:8px;
      background:#111;
      display:block;
    }

    /* Garantir que o texto ocupe exatamente a mesma altura visual da foto
       e que, junto com a foto, preencham horizontalmente o topo. */
    h1 {
      margin:0;
      padding:0;
      color:#ff0000;
      text-shadow:0 0 15px rgba(255,0,0,0.95), 0 0 30px rgba(255,0,0,0.65);
      letter-spacing:0.18em;
      display:flex;
      align-items:center;
      height:100%;              /* mesma altura que a foto */
      flex:1 1 auto;            /* ocupa o espaço horizontal restante */
      font-size: calc(var(--hero-h) * 0.42); /* escala proporcional à altura do header */
      line-height:1;            /* evita quebra vertical dentro do header */
      text-align:left;
      overflow:hidden;
      white-space:nowrap;
      justify-content:flex-start; /* texto alinhado à esquerda dentro do espaço */
    }

    /* PORTAL: ocupa toda a largura horizontal; centraliza verticalmente no espaço restante */
    .portal-area {
      width:100%;
      height: calc(100vh - var(--hero-h)); /* altura restante do viewport */
      display:flex;
      align-items:center;    /* centra verticalmente a imagem do portal */
      justify-content:center;
      overflow:hidden;
      position:relative;
      z-index:1;
      background:#000;
    }

    .portal-img {
      width:100%;
      max-width:100%;
      height:auto;
      max-height:100%;
      object-fit:contain;
      object-position:center center;
      display:block;
    }

    .porta {
      position:absolute;
      left:33%;
      top:28%;
      width:34%;
      height:58%;
      cursor:pointer;
      background: radial-gradient(ellipse at center, rgba(255,0,0,0.22) 0%, transparent 70%);
      box-shadow:0 0 20px rgba(255,0,0,0.5);
      opacity:0;
      transition: opacity 0.5s ease;
      border-radius:6px;
    }
    .porta:hover { opacity:1; animation:respirar 1.6s infinite ease-in-out; }
    @keyframes respirar {
      0% { box-shadow:0 0 10px rgba(255,0,0,0.4); }
      50% { box-shadow:0 0 40px rgba(255,0,0,1), inset 0 0 20px rgba(255,0,0,0.4); }
      100% { box-shadow:0 0 10px rgba(255,0,0,0.4); }
    }

    .toque {
      margin-top:18px;
      color:#ff0000;
      letter-spacing:4px;
      font-size:13px;
      text-shadow:0 0 8px red;
      opacity:0.9;
      text-align:center;
    }

    /* ajustes para telas pequenas */
    @media (max-width:720px) {
      :root { --hero-h: clamp(72px, 14vh, 110px); }
      h1 { font-size: calc(var(--hero-h) * 0.38); text-align:left; }
      .hero { padding:0 10px; gap:10px; }
      .profile-photo { height:100%; }
      .portal-area { height: calc(100vh - var(--hero-h)); }
      .portal-img { object-position:center center; }
    }
  </style>
</head>

<body>
  <header class="hero">
    <div class="profile-wrap">
      <img class="profile-photo" src="kira-3x4.jpg" alt="Kira Lux">
    </div>
    <h1>KIRA LUX</h1>
  </header>

  <main class="portal-area">
    <img class="portal-img" src="kira-portal.jpg" alt="Portal Kira Lux">
    <a href="galeria.html" class="porta" aria-label="Entrar"></a>
  </main>

  <div class="toque">TOQUE NA PORTA</div>
</body>
</html>
