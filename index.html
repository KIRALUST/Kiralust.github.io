<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIRA LUX</title>
<style>
* {margin:0; padding:0; box-sizing:border-box;}
body {background:#000; color:#fff; font-family:'Georgia', serif; overflow:hidden;}

.header {
    background:#000;
    padding:15px 20px;
    position:sticky;
    top:0;
    z-index:10;
    border-bottom:2px solid #DC143C;
}
.top {
    display:flex;
    align-items:center;
    gap:20px;
    margin-bottom:12px;
}
.top img {
    width:90px; /* AUMENTEI - era 55px */
    height:90px;
    border:3px solid #DC143C;
    object-fit:cover;
    box-shadow:0 0 15px #DC143C;
}
.top h1 {
    color:#DC143C;
    font-size:52px; /* AUMENTEI - era 36px */
    text-shadow:0 0 20px #DC143C, 0 0 40px #DC143C;
    letter-spacing:5px;
    animation:brilhar 2s infinite;
}
@keyframes brilhar {
    0%,100% {opacity:1; text-shadow:0 0 20px #DC143C, 0 0 40px #DC143C;}
    50% {opacity:0.8; text-shadow:0 0 10px #DC143C, 0 0 20px #DC143C;}
}
.menu {
    display:flex;
    gap:12px;
}
.menu a {
    flex:1;
    text-align:center;
    color:#DC143C;
    text-decoration:none;
    border:1px solid #DC143C;
    padding:8px 0;
    font-size:15px;
    letter-spacing:2px;
    transition:0.3s;
}
.menu a:hover {background:#DC143C; color:#000; box-shadow:0 0 15px #DC143C;}

.banner {
    width:100%;
    height:calc(100vh - 145px);
    background:url('Messenger_creation_1107486295409870.jpeg?v=2') center/cover no-repeat; /* CORRIGI - cover pra aparecer inteira */
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
}
