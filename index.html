<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>KIRA LUX | Arte Digital</title>
<style>
    body { margin: 0; background: #000; overflow: hidden; height: 100vh; }
    .homepage-container { position: fixed; width: 100%; height: 100%; }
    .homepage-container img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.4); transition: 0.5s; }
    body.porta-hover .homepage-container img { filter: brightness(0.6) contrast(1.1); }
    .porta-botao {
        position: absolute; bottom: 12%; right: 14%; width: 160px; height: 340px; 
        cursor: pointer; transition: 0.4s;
    }
    .porta-botao:hover {
        box-shadow: 0 0 20px rgba(255, 215, 0, 0.6), 0 0 40px rgba(255, 215, 0, 0.4);
        transform: scale(1.02);
    }
</style>
</head>
<body>
<div class="homepage-container">
    <img src="IMG_7626ec1b-7792-4558-a23e -425500198d68.jpg" alt="Portal">
    <a href="galeria.html" class="porta-botao" id="portaBtn"></a>
</div>

<audio id="somPorta" src="https://cdn.pixabay.com/download/audio/2022-03-24/03-31-33-100.mp3"></audio>
<script>
    const porta = document.getElementById('portaBtn');
    const som = document.getElementById('somPorta');
    let tocou = false;
    porta.addEventListener('mouseenter', () => {
        document.body.classList.add('porta-hover');
        if(!tocou) { som.volume = 0.4; som.play(); tocou = true; setTimeout(() => { tocou = false }, 2000); }
    });
    porta.addEventListener('mouseleave', () => { document.body.classList.remove('porta-hover'); });
</script>
</body>
</html>
