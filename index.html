<!DOCTYPE html>

<head>

<title>KIRA LUX | Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<style>
body, html { margin:0; padding:0; background:#000; height:100%; overflow:hidden; }
.homepage-container { position:relative; width:100%; height:100vh; }

/* PORTAL INTEIRO */
.portal-img {
    width: 100%;
    height: 100vh;
    object-fit: contain;
    background: #000;
}

/* TOPO */
.topo {
    position:absolute; 
    top:20px; 
    left:20px; 
    z-index:999;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.linha-topo {
    display:flex;
    align-items:center;
    gap:15px;
}

.foto {
    width:25vw; 
    max-width:120px; 
    border:2px solid #DC143C; /* borda vermelha também */
    border-radius:2px;
}

/* NOME VERMELHO SANGUE */
.nome {
    font-family:'Cinzel', serif; 
    font-size:8vw; 
    font-weight:700;
    color:#DC143C; /* VERMELHO CRIMSON */
    margin:0; 
    text-shadow:0 0 12px #DC143C, 0 0 3px #000; /* brilho vermelho */
    letter-spacing:3px;
}

.botoes {
    display:flex; 
    gap:10px;
}
.botoes a {
    padding:7px 14px; 
    background:rgba(0,0,0,0.8); 
    color:#DC143C; /* botões vermelhos também */
    text-decoration:none; 
    border:1px solid #DC143C;
    font-family:Arial;
    font-size:14px;
    transition:0.3s;
}
.botoes a:hover {
    background:#DC143C;
    color:#000;
}

/* BOTÃO INVISÍVEL DA PORTA */
.porta-botao {
    position:absolute; 
    top:45%; 
    left:68%; 
    width:18%; 
    height:35%; 
    z-index:998;
}
</style>
</head>
<body>

<div class="homepage-container">

    <!-- TOPO -->
    <div class="topo">
        <!-- FOTO + NOME LADO A LADO -->
        <div class="linha-topo">
            <img src="image_d73fa71d.jpg" class="foto">
            <h1 class="nome">KIRA LUX</h1>
        </div>
