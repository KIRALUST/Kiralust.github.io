<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIRA LUX</title>
<style>
html,body{margin:0;padding:0;background:#000;width:100%;height:100%;overflow:hidden}
.topo{width:100%;height:125px;background:#000}
.topo img{width:100%;height:125px;object-fit:cover;display:block}
.portal{width:100%;height:calc(100vh - 125px);background:#000;display:flex;justify-content:center;align-items:center}
.portal img{width:100%;height:100%;object-fit:contain;display:block;background:#000}
</style>
</head>
<body>
<div class="topo">
<img src="kira-3x4.jpg" alt="Kira Lux">
</div>
<div class="portal">
<img src="kira-portal.jpg" alt="Portal">
</div>
</body>
</html>
