<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIRA LUX | Arte Digital</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; height: 100vh; }
    .homepage-container { position: fixed; width: 100%; height: 100%; }
    .homepage-container img { 
        width: 100%; 
        height: 100%; 
        object-fit: cover; 
        filter: brightness(0.4); 
        transition: 0.5s ease; 
    }
    body.porta-hover .homepage-container img { 
        filter: brightness(0.6) contrast(1.1); 
    }

    /* BOTÃO AJUSTADO PARA A PORTA EM PERSPECTIVA */
    .porta-botao {
        position: absolute; 
        bottom: 7%;           /* altura da base da porta */
        right: 9.5%;          /* posição horizontal */
        width: 105px;         /* largura da porta na foto */
        height: 370px;        /* altura da porta na foto */
        cursor: pointer; 
        transition: 0.4s;
        z-index: 10;
        border-radius: 50px 50px 0 0; /* topo arredondado */
        transform: skewX(-8deg); /* inclina pra seguir a perspectiva */
        transform-origin: bottom right;
        overflow: hidden;
    }
    .porta-botao:hover {
        box-shadow: 0 0 30px rgba(255, 215, 0, 0.9), 0 0 60px rgba(255, 215, 0, 0.6);
        transform: skewX(-8deg) scale(1.03); /* mantém a inclinação no hover */
    }
</style>
</head>
<body>
<div class="homepage-container">
    <img src="IMG_7ab253ae-9f9b-4505-81ef-bd4e09a3fd06.jpg" alt="Portal">
    <a href="galeria.html" class="porta-botao" id="portaBtn"></a>
</div>

<audio id="somPorta" src="https://cdn.pixabay.com/download/audio/2022-03-24/03-31-33-100.mp3" preload="auto"></audio>

<script>
    const porta = document.getElementById('portaBtn');
    const som = document.getElementById('somPorta');
    let tocou = false;
    porta.addEventListener('mouseenter', () => {
        document.body.classList.add('porta-hover');
        if(!tocou) { 
            som.volume = 0.4; 
            som.play(); 
            tocou = true; 
            setTimeout(() => { tocou = false }, 2000); 
        }
    });
    porta.addEventListener('mouseleave', () => { 
        document.body.classList.remove('porta-hover'); 
    });
</script>
</body>
</html>
