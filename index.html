<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KIRA LUX - Portal</title>

  <link rel="stylesheet" href="style.css">

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:#000;
      color:#fff;
      font-family: Arial, Helvetica, sans-serif;
      display:flex;
      flex-direction:column;
      align-items:center;
      min-height:100vh;
      padding:20px 12px;
    }

    .hero {
      display:flex;
      align-items:center;
      gap:18px;
      margin-top:12px;
      width:100%;
      max-width:980px;
      justify-content:flex-start;
      flex-wrap:nowrap;
    }

    .profile-wrap { flex: 0 0 auto; }

    .profile-photo {
      width:120px;
      min-width:80px;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      border: 3px solid #ff0000;
      box-shadow: 0 0 18px rgba(255,0,0,0.7), 0 0 28px rgba(255,0,0,0.35);
      border-radius:8px;
      background:#111;
      display:block;
    }

    h1 {
      color:#ff0000;
      text-shadow:0 0 15px red, 0 0 30px red;
      letter-spacing:10px;
      font-size:36px;
      line-height:1.05;
      margin:0;
      padding:6px 0;
      flex: 1 1 auto;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .portal {
      position:relative;
      line-height:0;
      z-index: 1;
      margin-top: -6vh;
      width:100%;
      display:flex;
      justify-content:center;
    }

    .portal img {
      max-width:95vw;
      max-height:62vh;
      width:auto;
      height:auto;
      display:block;
    }

    .porta {
      position:absolute;
      left:33%; top:28%; width:34%; height:58%;
      cursor:pointer;
      background: radial-gradient(ellipse at center, rgba(255,0,0,0.22) 0%, transparent 70%);
      box-shadow:0 0 20px rgba(255,0,0,0.5);
      opacity:0;
      transition: opacity 0.5s ease;
      border-radius:6px;
    }

    .porta:hover {
      opacity:1;
      animation: respirar 1.6s infinite ease-in-out;
    }

    @keyframes respirar {
      0% { box-shadow:0 0 10px rgba(255,0,0,0.4); }
      50% { box-shadow:0 0 40px rgba(255,0,0,1), inset 0 0 20px rgba(255,0,0,0.4); }
      100% { box-shadow:0 0 10px rgba(255,0,0,0.4); }
    }

    .toque {
      margin-top:16px;
      color:#ff0000;
      letter-spacing:4px;
      font-size:13px;
      text-shadow:0 0 8px red;
      opacity:0.9;
    }

    @media (max-width:720px) {
      .profile-photo { width:96px; }
      h1 { font-size:24px; letter-spacing:8px; }
      .portal img { max-height:52vh; }
      .porta { left:28%; top:26%; width:44%; height:58%; }
      body { padding:12px; }
    }
  </style>
</head>

<body>
  <header class="hero">
    <div class="profile-wrap">
      <img class="profile-photo" src="kira-3x4.jpg" alt="Kira Lux">
    </div>
    <h1>KIRA LUX</h1>
  </header>

  <div class="portal">
    <img src="kira-portal.jpg" alt="Portal Kira Lux">
    <a href="galeria.html" class="porta" aria-label="Entrar"></a>
  </div>

  <div class="toque">TOQUE NA PORTA</div>
</body>
</html>
