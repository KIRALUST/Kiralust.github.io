<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIRA LUX</title>
<style>
body{
    background:#000;
    color:#DC143C;
    font-family:Georgia, serif;
    margin:0;
    text-align:center;
}
.porta{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:radial-gradient(circle, #1a0000 0%, #000 100%);
}
h1{
    font-size:60px;
    letter-spacing:5px;
    text-shadow:0 0 20px #DC143C, 0 0 40px #DC143C;
    margin-bottom:40px;
}
.btn-entrar{
    padding:15px 50px;
    font-size:22px;
    color:#fff;
    background:transparent;
    border:2px solid #DC143C;
    text-decoration:none;
    transition:0.3s;
    margin-bottom:30px;
}
.btn-entrar:hover{
    background:#DC143C;
    color:#000;
    box-shadow:0 0 20px #DC143C;
}
.menu a{
    color:#DC143C;
    text-decoration:none;
    font-size:18px;
    margin:0 15px;
    transition:0.3s;
}
.menu a:hover{
    color:#fff;
    text-shadow:0 0 10px #DC143C;
}
</style>
</head>
<body>

<div class="porta">
    <h1>KIRA LUX</h1>
    
    <a href="/menu.html" class="btn-entrar">ENTRAR</a>
    
    <div class="menu">
        <a href="/sobre.html">Sobre</a>
        <a href="/galeria.html">Galeria</a>
        <a href="/contato.html">Contato</a>
    </div>
</div>

</body>
</html>
