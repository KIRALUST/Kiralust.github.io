<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIRA LUX - Portal</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; color:#fff; font-family:Arial; display:flex; flex-direction:column; align-items:center; min-height:100vh; }
  h1 { color:#ff0000; text-shadow:0 0 15px red, 0 0 30px red; letter-spacing:12px; margin:25px 0 15px; font-size:32px; }
  .portal { position:relative; line-height:0; }
  .portal img { max-width:95vw; max-height:75vh; width:auto; height:auto; display:block; }
  
  /* BOTÃO INVISÍVEL QUE RESPIRA - CORRIGIDO PASSADA RÁPIDA */
  .porta {
    position:absolute;
    left:33%; top:28%; width:34%; height:58%;
    cursor:pointer;
    background: radial-gradient(ellipse at center, rgba(255,0,0,0.22) 0%, transparent 70%);
    box-shadow:0 0 20px rgba(255,0,0,0.5);
    opacity:0;
    transition: opacity 0.5s ease;
    border-radius:6px;
  }
  .porta:hover {
    opacity:1;
    animation: respirar 1.6s infinite ease-in-out;
  }
  @keyframes respirar {
    0% { box-shadow:0 0 10px rgba(255,0,0,0.4); }
    50% { box-shadow:0 0 40px rgba(255,0,0,1), inset 0 0 20px rgba(255,0,0,0.4); }
    100% { box-shadow:0 0 10px rgba(255,0,0,0.4); }
  }
  .toque { margin-top:20px; color:#ff0000; letter-spacing:4px; font-size:13px; text-shadow:0 0 8px red; opacity:0.8; }
</style>
</head>
<body>
<h1>KIRA LUX</h1>
<div class="portal">
  <img src="kira-portal.jpg" alt="Portal Kira Lux">
  <a href="galeria.html" class="porta" aria-label="Entrar"></a>
</div>
<div class="toque">TOQUE NA PORTA</div>
</body>
</html>
