<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIRA LUX | Portal</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap" rel="stylesheet">

<style>
/* CAMADA NOVA POR CIMA */
.topo {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 999;
}
.foto {
    width: 30vw;
    max-width: 150px;
    border: 2px solid #8B0000;
    display: block;
    margin-bottom: 10px;
}
.nome {
    font-family: 'Cinzel', serif;
    font-size: 6vw;
    color: #DC143C;
    margin: 0 0 10px 0;
}
.botoes { display: flex; gap: 10px; }
.botoes a {
    padding: 5px 10px;
    background: rgba(0,0,0,0.6);
    color: #DC143C;
    text-decoration: none;
    border: 1px solid #8B0000;
    font-size: 14px;
}
</style>
</head>
<body>
<div class="homepage-container">
    
    <!-- NOVO: FOTO + NOME + BOTOES -->
    <div class="topo">
        <img src="image_d73fa71d.jpg" class="foto">
        <h1 class="nome">KIRA LUX</h1>
        <div class="botoes">
            <a href="#">Sobre</a>
            <a href="#">Contato</a>
        </div>
    </div>

    <!-- ANTIGO: PORTAL CONTINUA IGUAL -->
    
</div>
</body>
</html>
