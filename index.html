<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIRA LUX | Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
<style>
body, html { margin:0; padding:0; background:#000; height:100%; overflow:hidden; }
.homepage-container { position:relative; width:100%; height:100vh; }

/* PORTAL INTEIRO */
.portal-img {
    width: 100%;
    height: 100vh;
    object-fit: contain;
    background: #000;
}

/* TOPO OCUPANDO A LARGURA TODA */
.topo {
    position:absolute; 
    top:15px; 
    left:15px; 
    right:15px; /* <-- ocupa até a direita */
    z-index:999;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.linha-topo {
    display:flex;
    align-items:center;
    gap:15px;
    width:100%;
}

/* FOTO MAIOR */
.foto {
    height:14vh; /* aumentei */
    max-height:120px;
    width:auto;
    border:3px solid #DC143C; /* borda mais grossa */
    border-radius:3px;
    flex-shrink:0;
}

/* NOME MAIOR E ESTICADO */
.nome {
    font-family:'Cinzel', serif; 
    font-size:9vw; /* usa % da largura da tela */
    font-weight:700;
    color:#DC143C; /* VERMELHO */
    margin:0; 
    text-shadow:0 0 12px #DC143C, 2px 2px 5px #000;
    letter-spacing:3px;
    white-space:nowrap;
    flex-grow:1; /* ocupa o resto do espaço */
}

.botoes {
    display:flex; 
    gap:10px;
    justify-content:space-between; /* 3 botões distribuídos */
}
.botoes a {
    flex:1; /* cada botão ocupa 1/3 */
    text-align:center;
    padding:8px 5px; 
    background:rgba(0,0,0,0.85); 
    color:#DC143C; 
    text-decoration:none; 
    border:1px solid #DC143C;
    font-family:Arial;
    font-size:14px;
    font-weight:bold;
    transition:0.3s;
}
.botoes a:hover {
    background:#DC143C;
    color:#000;
}

.porta-botao {

    top:45%; 
    left:68%;
