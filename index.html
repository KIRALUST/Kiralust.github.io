<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIRA LUX</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    background: #000;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
  }

  /* TOPO COM FOTO + LOGOTIPO */
  .topo-header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 15px 20px;
    z-index: 9999;
    background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
  }

  .foto-3x4 {
    width: 65px;
    height: 85px;
    object-fit: cover;
    border: 2px solid #fff;
    border-radius: 4px;
    box-shadow: 0 0 15px rgba(255,255,255,0.2);
    flex-shrink: 0;
  }

  .logo-kira {
    flex: 1; /* ISSO FAZ ELE OCUPAR TODO O RESTO */
    color: #ff0000;
    font-family: Impact, 'Arial Black', sans-serif;
    font-size: 7vw; /* ocupa a largura toda */
    letter-spacing: 0.15em;
    font-weight: 900;
    text-transform: uppercase;
    line-height: 1;
    text-shadow: 0 0 10px rgba(255,0,0,0.6), 2px 2px 0 #000;
    white-space: nowrap;
    overflow: hidden;
  }

  .portal-wrapper {
    position: relative;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #000;
    padding-top: 60px;
  }

  .portal-img {
    width: 85%;
    max-width: 900px;
    height: auto;
    animation: respira 3s ease-in-out infinite;
  }

  @keyframes respira {
    0%, 100% { transform: scale(1); filter: brightness(1); }
    50% { transform: scale(1.02); filter: brightness(1.1); }
  }

  .texto-toque {
    color: #fff;
    font-family: monospace;
    font-size: 14px;
    letter-spacing: 4px;
    margin-top: 20px;
    opacity: 0.7;
  }

  .porta-botao {
    position: absolute;
    top: 52%;
    left: 52%;
    transform: translate(-50%, -50%);
    width: 16%;
    height: 32%;
    z-index: 998;
    cursor: pointer;
  }
</style>
</head>
<body>

<!-- TOPO NOVO: FOTO + LOGO -->
<header class="topo-header">
  <img src="kira-3x4.jpg" class="foto-3x4" alt="Kira">
  <h1 class="logo-kira">KIRA LUX</h1>
</header>

<div class="portal-wrapper">
    <img src="Messenger_creation_1107486295409870.jpeg" class="portal-img">
    <p class="texto-toque">TOQUE NA PORTA</p>
    <a href="menu.html" class="porta-botao"></a>
</div>

</body>
</html>
