<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIRA LUX | Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
<style>
body, html { margin:0; padding:0; background:#000; height:100%; overflow:hidden; }
.homepage-container { position:relative; width:100%; height:100vh; }

/* PORTAL */
.portal-wrapper { position:relative; width:100%; height:100vh; display:flex; align-items:center; justify-content:center; background:#000; }
.portal-img { width: 100%; height: 100vh; object-fit: contain; }

/* TOPO - FOTO + NOME */
.topo { position:absolute; top:15px; left:15px; right:15px; z-index:999; display:flex; flex-direction:column; gap:12px; }
.linha-topo { display:flex; align-items:center; gap:15px; width:100%; }
.foto { height:14vh; max-height:120px; border:3px solid #DC143C; border-radius:3px; flex-shrink:0; }
.nome { font-family:'Cinzel', serif; font-size:9vw; font-weight:700; color:#DC143C; margin:0; text-shadow:0 0 12px #DC143C, 2px 2px 5px #000; letter-spacing:3px; white-space:nowrap; flex-grow:1; }

/* 3 BOTOES */
.botoes { display:flex; gap:10px; justify-content:space-between; }
.botoes a { flex:1; text-align:center; padding:8px 5px; background:rgba(0,0,0,0.85); color:#DC143C; text-decoration:none; border:1px solid #DC143C; font-family:Arial; font-size:14px; font-weight:bold; }
.botoes a:hover { background:#DC143C; color:#000; }

/* BOTÃO DA PORTA - JÁ AJUSTADO PRA FICAR NO MEIO */
.porta-botao { 
    position:absolute; 
    top:47%;   /* desci 1% pra ficar no centro */
    left:67%;  /* centralizado na porta */
    transform:translate(-50%, -50%); /* trava no centro exato */
    width:17%;  /* aumentei um pouco a área de clique */
    height:33%; 
    z-index:998; 
    cursor:pointer; 
}
</style>
</head>
<body>

<div class="homepage-container">

    <!-- TOPO -->
    <div class="topo">
        <div class="linha-topo">
            <img src="image_d73fa71d.jpg" class="foto">
            <h1 class="nome">KIRA LUX</h1>
        </div>
        <div class="botoes">
            <a href="sobre.html">Sobre</a>
            <a href="galeria.html">Galeria</a>
            <a href="contato.html">Contato</a>
        </div>
    </div>

    <!-- PORTAL + BOTAO -->
    <div class="portal-wrapper">
        <img src="Messenger_creation_1107486295409870.jpeg" class="portal-img">
        <a href="galeria.html" class="porta-botao"></a>
    </div>

</div>

</body>
</html>
