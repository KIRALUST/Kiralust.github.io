<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIRA LUX | Portal</title>
<style>
  body, html { 
    margin:0; 
    padding:0; 
    background:#000; 
    height:100%; 
    width:100%;
    overflow:hidden; 
  }
  .container {
    position:relative;
    width:100vw;
    height:100vh;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
  }
  .portal-full {
    width:100%;
    height:100vh;
    object-fit:contain; /* ISSO FAZ APARECER INTEIRA */
    background:#000;
  }
  /* Área clicável da porta */
  .porta-link {
    position:absolute;
    top:32%;
    left:71%;
    width:18%;
    height:50%;
    cursor:pointer;
    z-index:10;
  }
</style>
</head>
<body>

<div class="container">
  <!-- AQUI ESTÁ COM O NOME NOVO MINÚSCULO -->
  <img src="kira-portal.jpg" class="portal-full" alt="Kira Lux Portal">
  
  <!-- Clique na porta leva pra galeria -->
  <a href="galeria.html" class="porta-link"></a>
</div>

</body>
</html>
