<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIRA LUX</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; width: 100vw; height: 100vh; overflow: hidden; }

  .topo-header {
    position: fixed; top: 0; left: 0; width: 100%;
    display: flex; align-items: center; gap: 15px;
    padding: 15px 20px; z-index: 9999;
    background: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,0.8) 40%, transparent 100%);
  }
  .foto-3x4 {
    width: 55px; height: 75px;
    object-fit: cover;
    border: 2px solid #fff;
    border-radius: 3px;
    flex-shrink: 0;
  }
  .logo-kira {
    flex: 1; color: #ff0000;
    font-family: Impact, 'Arial Black', sans-serif;
    font-size: 9vw; letter-spacing: 0.2em; font-weight: 900;
    text-shadow: 0 0 12px rgba(255,0,0,0.8), 0 0 25px rgba(255,0,0,0.4);
    white-space: nowrap;
  }

  .portal-wrapper {
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding-top: 85px;
    background: #000;
  }
  .portal-box {
    position: relative;
    width: 100vw;
    display: flex;
    justify-content: center;
  }
  .portal-img {
    width: 100vw;
    height: auto;
    max-height: 80vh;
    object-fit: contain;
    display: block;
  }
  .texto-toque {
    color: #fff; font-family: monospace;
    font-size: 10px; letter-spacing: 4px;
    margin-top: 15px; opacity: 0.6;
  }

  /* BOTÃO VERMELHO TRANSPARENTE NA PORTA */
  .porta-botao {
    position: absolute;
    top: 30%;
    left: 57%;
    width: 35%;
    height: 52%;
    z-index: 10;
    cursor: pointer;
    background: rgba(255, 0, 0, 0.28);
    border: 1px solid rgba(255, 0, 0, 0.55);
    box-shadow: 0 0 18px rgba(255, 0, 0, 0.45);
    border-radius: 2px;
  }
  .porta-botao:active {
    background: rgba(255, 0, 0, 0.45);
  }
</style>
</head>
<body>

<header class="topo-header">
  <img src="kira-3x4.jpg" class="foto-3x4" alt="Kira">
  <h1 class="logo-kira">KIRA LUX</h1>
</header>

<div class="portal-wrapper">
  <div class="portal-box">
    <img src="kira-portal.jpg" class="portal-img" alt="Portal">
    <a href="menu.html" class="porta-botao" title="Toque na porta"></a>
  </div>
  <p class="texto-toque">TOQUE NA PORTA</p>
</div>

</body>
</html>
